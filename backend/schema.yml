  /api/reports/:
    get:
      operationId: api_reports_list
      description: Fetch paginated Hifz daily reports with filtering options. Excludes
        soft-deleted reports.
      summary: List Daily Hifz Reports
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Filter by report date (YYYY-MM-DD)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: session_name
        schema:
          type: string
        description: Filter by session name (e.g., Subah, Asr, Maghrib)
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (Completed, Unprepared, Absent)
      - in: query
        name: student_name
        schema:
          type: string
        description: Filter by student name
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentDailyReportList'
          description: ''
    post:
      operationId: api_reports_create
      description: Creates a new daily report with nested portions and error details
        (mistakes and stucks).
      summary: Create New Daily Hifz Report
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentDailyReportRequest'
            examples:
              CreateReportExample:
                value:
                  student: 1
                  student_name: Ahmad Hassan
                  session_name: Subah
                  total_page: 5
                  score: 95.0
                  status: Completed
                  comment: Excellent recitation
                  portions:
                  - start_juz: 1
                    start_page: 1
                    start_ayah: 1
                    end_juz: 1
                    end_page: 5
                    end_ayah: 30
                  error_details:
                  - type: Mistake
                    juz: 1
                    page: 2
                    ayah: 10
                  - type: Stuck
                    juz: 1
                    page: 4
                    ayah: 15
                summary: Create Report Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentDailyReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentDailyReportRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDailyReport'
              examples:
                CreateReportExample:
                  value:
                    student: 1
                    student_name: Ahmad Hassan
                    session_name: Subah
                    total_page: 5
                    score: 95.0
                    status: Completed
                    comment: Excellent recitation
                    portions:
                    - start_juz: 1
                      start_page: 1
                      start_ayah: 1
                      end_juz: 1
                      end_page: 5
                      end_ayah: 30
                    error_details:
                    - type: Mistake
                      juz: 1
                      page: 2
                      ayah: 10
                    - type: Stuck
                      juz: 1
                      page: 4
                      ayah: 15
                  summary: Create Report Example
          description: ''
  /api/reports/{id}/:
    get:
      operationId: api_reports_retrieve
      description: |-
        Full CRUD for StudentDailyReport.
        Automatically excludes soft-deleted reports (status_info__is_deleted=True).
        Supports filtering by: student_name, date (report date), session_name, status.
      parameters:
      - in: path
        name: id
