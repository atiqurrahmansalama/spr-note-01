    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TypeEnum:
      enum:
      - Mistake
      - Stuck
      type: string
      description: |-
        * `Mistake` - Mistake
        * `Stuck` - Stuck
    UserTypeEnum:
      enum:
      - SUPER_ADMIN
      - ADMIN
      - TEACHER
      - GUARDIAN
      - STAFF
      type: string
      description: |-
        * `SUPER_ADMIN` - Super Admin
        * `ADMIN` - Admin / Nazim
        * `TEACHER` - Teacher / Ustadh
        * `GUARDIAN` - Guardian / Parent
        * `STAFF` - Staff / Accountant
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
