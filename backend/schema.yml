                $ref: '#/components/schemas/StudentDailyReport'
          description: ''
    delete:
      operationId: api_reports_destroy
      description: Marks status_info.is_deleted=True and sets delete_time timestamp.
      summary: Soft Delete Daily Hifz Report
      parameters:
      - in: path
        name: id
