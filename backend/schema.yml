      description: Fetches active time windows, total active durations, and critical
        activity logs per user/teacher for reporting.
      summary: User Activity & Time Monitoring Analytics (Admin Only)
      parameters:
      - in: query
        name: device_type
        schema:
          type: string
        description: Filter device type (android, ios, web)
      - in: query
        name: from_date
        schema:
          type: string
          format: date
        description: Filter start date (YYYY-MM-DD)
      - in: query
        name: to_date
        schema:
          type: string
          format: date
        description: Filter end date (YYYY-MM-DD)
      - in: query
        name: user_id
        schema:
          type: integer
        description: Filter specific User ID
      - in: query
        name: user_type
        schema:
          type: string
        description: Filter user role (e.g. TEACHER, ADMIN)
      tags:
      - analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: User Activity Summary & Time Windows
