name: SPR Note Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Test Suite (PostgreSQL 16 & Redis 7)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spr_note_ci_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Django Configuration Check
        run: |
          cd backend
          python manage.py check

      - name: Apply Database Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spr_note_ci_db
          REDIS_URL: redis://localhost:6379/0
          USE_SQLITE: "False"
          SECRET_KEY: ci-test-secret-key-environment-minimum-50-characters-long
          DEBUG: "False"
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Execute Full Test Suite & Multi-Tenant Isolation Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spr_note_ci_db
          REDIS_URL: redis://localhost:6379/0
          USE_SQLITE: "False"
          SECRET_KEY: ci-test-secret-key-environment-minimum-50-characters-long
          DEBUG: "False"
        run: |
          cd backend
          python manage.py test core --noinput

  frontend-ci:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Static Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Production Vite Build
        run: |
          cd frontend
          npm run build
