name: 3-Tier Enterprise Database & Media Hourly Backup

on:
  schedule:
    # Trigger automatically every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      destination:
        description: 'Backup Target Destination'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'github_vault'
          - 'google_drive'
          - 'cloudflare_r2'

jobs:
  hourly_full_backup:
    name: Generate 100% Full System Archive & Cloud Sync
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System PostgreSQL Client Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gzip

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install psycopg2-binary dj-database-url

      - name: Execute 100% Full System Enterprise Backup
        working-directory: backend
        env:
          USE_SQLITE: 'False'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: 'core.settings'
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'github-actions-backup-runner-secure-key-99' }}
        run: |
          mkdir -p backups
          python manage.py backup_full_system --output-dir=backups

      - name: Locate Generated Archive & Sidecar
        id: archive_info
        working-directory: backend
        run: |
          ARCHIVE_FILE=$(ls -t backups/enterprise_full_backup_*.tar.gz | head -n 1)
          SHA256_FILE=$(ls -t backups/enterprise_full_backup_*.sha256 | head -n 1)
          echo "archive_path=${ARCHIVE_FILE}" >> $GITHUB_OUTPUT
          echo "archive_name=$(basename ${ARCHIVE_FILE})" >> $GITHUB_OUTPUT
          echo "sha256_path=${SHA256_FILE}" >> $GITHUB_OUTPUT
          echo "Generated Archive: $(basename ${ARCHIVE_FILE})"
          cat ${SHA256_FILE}

      - name: Tier 1 - Store in GitHub Encrypted Artifact Vault
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive_info.outputs.archive_name }}
          path: |
            backend/${{ steps.archive_info.outputs.archive_path }}
            backend/${{ steps.archive_info.outputs.sha256_path }}
          retention-days: 90
          compression-level: 0

      - name: Tier 1 - Sync to Cloudflare R2 / AWS S3 (If Configured)
        if: env.R2_ACCESS_KEY != ''
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'spr-enterprise-backups' }}
        run: |
          pip install boto3
          python - <<EOF
          import os, boto3
          s3 = boto3.client(
              's3',
              endpoint_url=os.environ['R2_ENDPOINT_URL'],
              aws_access_key_id=os.environ['R2_ACCESS_KEY'],
              aws_secret_access_key=os.environ['R2_SECRET_KEY']
          )
          archive_path = "backend/${{ steps.archive_info.outputs.archive_path }}"
          archive_name = "${{ steps.archive_info.outputs.archive_name }}"
          print(f"Uploading {archive_name} to R2 bucket...")
          s3.upload_file(archive_path, os.environ['R2_BUCKET_NAME'], f"hourly/{archive_name}")
          print("R2 Cloud Sync Completed Successfully.")
          EOF
