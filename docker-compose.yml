version: '3.8'

services:
  # 1. PostgreSQL Enterprise Database Service
  postgres_db:
    image: postgres:16-alpine
    container_name: spr_postgres_db
    restart: always
    environment:
      POSTGRES_DB: spr_note_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spr_note_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis High-Performance Cache & Celery Task Broker
  redis:
    image: redis:7-alpine
    container_name: spr_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Celery Asynchronous Background Task Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spr_celery_worker
    restart: always
    command: celery -A core worker -l info --concurrency=4
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/spr_note_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "False"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Beat Periodic Task Scheduler
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spr_celery_beat
    restart: always
    command: celery -A core beat -l info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/spr_note_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DEBUG: "False"
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

